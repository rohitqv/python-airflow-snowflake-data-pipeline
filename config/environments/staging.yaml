# Staging Environment Configuration

# Override base config for staging (production-like but smaller scale)
spark:
  master: "spark://staging-spark-master:7077"
  config:
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"
    spark.executor.cores: "2"
    spark.executor.instances: "4"

snowflake:
  warehouse: "STAGING_WAREHOUSE"
  database: "STAGING_DATABASE"
  schema: "STAGING_SCHEMA"
  role: "STAGING_ROLE"

# Staging-specific settings
data_quality:
  enable_validation: true
  max_corrupt_records_percent: 3  # Moderate validation
  required_columns_check: true
  null_check_threshold: 8

monitoring:
  log_level: "INFO"
  enable_metrics: true
  enable_alerts: false  # No alerts in staging

processing:
  batch_size: 20000
  parallel_jobs: 4
  retry_attempts: 2
  retry_delay_seconds: 300
